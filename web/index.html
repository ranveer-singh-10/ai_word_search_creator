<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Search Creator</title>
  <style>
    :root {
      --bg: #f6f5f1;
      --surface: #ffffff;
      --text: #1f2328;
      --muted: #5f6670;
      --border: #d8d6cf;
      --accent: #2f6f5e;
      --accent-text: #ffffff;
      --error-bg: #fbeaea;
      --error-text: #8a1f1f;
      --cell-bg: #fbfaf7;
      --select-bg: #f3d27a;
      --select-text: #1f2328;
      --found-bg: #b9dccf;
      --found-text: #12352b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181b;
        --surface: #1f2226;
        --text: #e6e6e3;
        --muted: #9aa1a9;
        --border: #34383e;
        --accent: #5fb39b;
        --accent-text: #0f1a17;
        --error-bg: #3a1d1d;
        --error-text: #f2b8b8;
        --cell-bg: #25292e;
        --select-bg: #8a6d1f;
        --select-text: #fff8e6;
        --found-bg: #2e5e50;
        --found-text: #e3f5ee;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    h1 { margin: 0 0 4px; font-size: 1.75rem; }
    .intro { margin: 0 0 24px; color: var(--muted); }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-end;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field.grow { flex: 1 1 220px; }

    label { font-size: 0.875rem; font-weight: 600; }

    input[type="text"], select {
      font: inherit;
      padding: 8px 10px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

    button {
      font: inherit;
      font-weight: 600;
      padding: 9px 20px;
      color: var(--accent-text);
      background: var(--accent);
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }

    input:focus-visible, select:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .status { margin: 16px 0 0; color: var(--muted); }
    .status.error {
      padding: 10px 12px;
      color: var(--error-text);
      background: var(--error-bg);
      border-radius: 6px;
    }
    .status:empty { display: none; }

    .puzzle {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 24px;
    }
    .puzzle[hidden] { display: none; }

    .grid {
      display: grid;
      grid-template-columns: repeat(var(--size), 1fr);
      width: min(100%, 560px);
      aspect-ratio: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      gap: 2px;
      user-select: none;
      touch-action: none;        /* stop touch drags from scrolling the page */
      cursor: pointer;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cell-bg);
      border-radius: 4px;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-weight: 600;
      font-size: clamp(0.75rem, calc(70vw / var(--size)), 1.4rem);
      transition: background-color 0.15s;
    }
    .cell.found { background: var(--found-bg); color: var(--found-text); }
    .cell.selecting { background: var(--select-bg); color: var(--select-text); }

    .words {
      flex: 1 1 240px;
      margin: 0;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .words h2 { margin: 0 0 12px; font-size: 1.1rem; }
    .words .progress { margin: -8px 0 12px; color: var(--muted); font-size: 0.875rem; }
    .words li.found strong { text-decoration: line-through; color: var(--muted); }
    .words li.found span { opacity: 0.6; }
    .words ul { margin: 0; padding: 0; list-style: none; }
    .words li { padding: 6px 0; border-top: 1px solid var(--border); }
    .words li:first-child { border-top: 0; }
    .words strong { display: block; letter-spacing: 0.05em; }
    .words span { color: var(--muted); font-size: 0.875rem; }
  </style>
</head>
<body>
  <main>
    <h1>Word Search Creator</h1>
    <p class="intro">Pick a category and difficulty, and Claude will choose the words for your puzzle.</p>

    <form id="puzzle-form">
      <div class="field grow">
        <label for="category">Category</label>
        <input id="category" name="category" type="text" required maxlength="50"
               placeholder="e.g. Space, Cars, Fruit" autocomplete="off">
      </div>

      <div class="field">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty" name="difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <label class="toggle">
        <input id="dynamic" name="dynamic" type="checkbox">
        Dynamic mode
      </label>

      <button id="submit" type="submit">Create puzzle</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="puzzle" class="puzzle" hidden>
      <div id="grid" class="grid" role="grid" aria-label="Word search grid"></div>
      <div class="words">
        <h2>Words to find</h2>
        <p id="progress" class="progress" aria-live="polite"></p>
        <ul id="word-list"></ul>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("puzzle-form");
    const submitButton = document.getElementById("submit");
    const statusEl = document.getElementById("status");
    const puzzleEl = document.getElementById("puzzle");
    const gridEl = document.getElementById("grid");
    const wordListEl = document.getElementById("word-list");
    const progressEl = document.getElementById("progress");

    // Puzzle state: cells[row][col] are the grid elements; each word has
    // {word, description, start: [row, col], end: [row, col], found, item}.
    let cells = [];
    let words = [];
    let drag = null;         // {start: [row, col], path: [[row, col], ...]} while dragging

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }

    function drawGrid(grid) {
      gridEl.replaceChildren();
      gridEl.style.setProperty("--size", grid.length);
      cells = [];

      grid.forEach((row, r) => {
        const rowEl = document.createElement("div");
        rowEl.setAttribute("role", "row");
        rowEl.style.display = "contents";
        cells.push([]);
        row.forEach((letter, c) => {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.setAttribute("role", "gridcell");
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.textContent = letter;
          rowEl.appendChild(cell);
          cells[r].push(cell);
        });
        gridEl.appendChild(rowEl);
      });
    }

    function drawWordList(list) {
      wordListEl.replaceChildren();
      words = list.map((entry) => {
        const item = document.createElement("li");
        const wordEl = document.createElement("strong");
        wordEl.textContent = entry.word;
        const descEl = document.createElement("span");
        descEl.textContent = entry.description;
        item.append(wordEl, descEl);
        wordListEl.appendChild(item);
        return { ...entry, found: false, item };
      });
      updateProgress();
    }

    function updateProgress() {
      const found = words.filter((w) => w.found).length;
      progressEl.textContent = `${found} of ${words.length} found`;
      if (words.length && found === words.length) {
        setStatus(`Well done! You found all ${words.length} words.`);
      }
    }

    // ----- Selection -----

    function cellAt(x, y) {
      const el = document.elementFromPoint(x, y);
      const cell = el && el.closest(".cell");
      return cell && gridEl.contains(cell) ? [Number(cell.dataset.row), Number(cell.dataset.col)] : null;
    }

    // Cells in a straight line from start towards target, snapped to the nearest
    // of the eight directions and clipped to the edge of the grid.
    function linePath(start, target) {
      const [r0, c0] = start;
      const dr = target[0] - r0;
      const dc = target[1] - c0;
      if (dr === 0 && dc === 0) return [start];

      const octant = Math.round(Math.atan2(dr, dc) / (Math.PI / 4));
      const stepR = Math.round(Math.sin(octant * Math.PI / 4));
      const stepC = Math.round(Math.cos(octant * Math.PI / 4));
      const size = cells.length;

      const path = [];
      for (let i = 0; i <= Math.max(Math.abs(dr), Math.abs(dc)); i++) {
        const r = r0 + stepR * i;
        const c = c0 + stepC * i;
        if (r < 0 || r >= size || c < 0 || c >= size) break;
        path.push([r, c]);
      }
      return path;
    }

    function showSelection(path) {
      gridEl.querySelectorAll(".cell.selecting").forEach((el) => el.classList.remove("selecting"));
      for (const [r, c] of path) cells[r][c].classList.add("selecting");
    }

    function sameCell(a, b) {
      return a[0] === b[0] && a[1] === b[1];
    }

    // The selection matches a word if its ends match the word's ends, in either order.
    function matchWord(path) {
      const first = path[0];
      const last = path[path.length - 1];
      return words.find((w) => !w.found && (
        (sameCell(first, w.start) && sameCell(last, w.end)) ||
        (sameCell(first, w.end) && sameCell(last, w.start))
      ));
    }

    function markFound(entry) {
      entry.found = true;
      entry.item.classList.add("found");
      for (const [r, c] of linePath(entry.start, entry.end)) cells[r][c].classList.add("found");
      updateProgress();
    }

    gridEl.addEventListener("pointerdown", (event) => {
      const start = cellAt(event.clientX, event.clientY);
      if (!start || !words.length) return;
      event.preventDefault();
      gridEl.setPointerCapture(event.pointerId);
      drag = { start, path: [start] };
      showSelection(drag.path);
    });

    gridEl.addEventListener("pointermove", (event) => {
      if (!drag) return;
      const target = cellAt(event.clientX, event.clientY);
      if (!target) return;
      drag.path = linePath(drag.start, target);
      showSelection(drag.path);
    });

    gridEl.addEventListener("pointerup", () => {
      if (!drag) return;
      const match = matchWord(drag.path);
      if (match) markFound(match);
      showSelection([]);
      drag = null;
    });

    gridEl.addEventListener("pointercancel", () => {
      showSelection([]);
      drag = null;
    });

    // FastAPI sends errors as {detail: "..."} for HTTPException,
    // or {detail: [{msg: "..."}]} when the request fails validation.
    function errorMessage(body, status) {
      const detail = body && body.detail;
      if (typeof detail === "string") return detail;
      if (Array.isArray(detail) && detail.length) return detail[0].msg;
      return `Something went wrong (error ${status}). Please try again.`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const payload = {
        category: form.category.value.trim(),
        difficulty: form.difficulty.value,
        dynamic: form.dynamic.checked,
      };
      if (!payload.category) {
        setStatus("Please enter a category.", true);
        return;
      }

      submitButton.disabled = true;
      setStatus("Creating your puzzle…");

      try {
        const response = await fetch("/api/puzzle", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const body = await response.json().catch(() => null);

        if (!response.ok) {
          setStatus(errorMessage(body, response.status), true);
          return;
        }

        drawGrid(body.grid);
        drawWordList(body.words);
        puzzleEl.hidden = false;
        setStatus("");
      } catch {
        setStatus("Couldn't reach the server. Is it running?", true);
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
