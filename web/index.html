<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Search Creator</title>
  <style>
    :root {
      --bg: #f6f5f1;
      --surface: #ffffff;
      --text: #1f2328;
      --muted: #5f6670;
      --border: #d8d6cf;
      --accent: #2f6f5e;
      --accent-text: #ffffff;
      --error-bg: #fbeaea;
      --error-text: #8a1f1f;
      --cell-bg: #fbfaf7;
      --select-bg: #f3d27a;
      --select-text: #1f2328;
      --found-bg: #b9dccf;
      --found-text: #12352b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181b;
        --surface: #1f2226;
        --text: #e6e6e3;
        --muted: #9aa1a9;
        --border: #34383e;
        --accent: #5fb39b;
        --accent-text: #0f1a17;
        --error-bg: #3a1d1d;
        --error-text: #f2b8b8;
        --cell-bg: #25292e;
        --select-bg: #8a6d1f;
        --select-text: #fff8e6;
        --found-bg: #2e5e50;
        --found-text: #e3f5ee;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    h1 { margin: 0 0 4px; font-size: 1.75rem; }
    .intro { margin: 0 0 24px; color: var(--muted); }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-end;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field.grow { flex: 1 1 220px; }

    label { font-size: 0.875rem; font-weight: 600; }

    input[type="text"], select {
      font: inherit;
      padding: 8px 10px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

    button {
      font: inherit;
      font-weight: 600;
      padding: 9px 20px;
      color: var(--accent-text);
      background: var(--accent);
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }

    input:focus-visible, select:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .travel {
      margin: 12px 0 0;
      padding: 10px 12px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .travel strong { color: var(--text); }

    .status { margin: 16px 0 0; color: var(--muted); }
    .status.error {
      padding: 10px 12px;
      color: var(--error-text);
      background: var(--error-bg);
      border-radius: 6px;
    }
    .status:empty { display: none; }

    .puzzle {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 24px;
    }
    .puzzle[hidden] { display: none; }

    .grid {
      display: grid;
      grid-template-columns: repeat(var(--size), 1fr);
      width: min(100%, 560px);
      aspect-ratio: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      gap: 2px;
      user-select: none;
      touch-action: none;        /* stop touch drags from scrolling the page */
      cursor: pointer;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cell-bg);
      border-radius: 4px;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-weight: 600;
      font-size: clamp(0.75rem, calc(70vw / var(--size)), 1.4rem);
      transition: background-color 0.15s;
    }
    .cell.found { background: var(--found-bg); color: var(--found-text); }
    .cell.selecting { background: var(--select-bg); color: var(--select-text); }
    .cell.selecting.end { box-shadow: inset 0 0 0 3px var(--accent); }

    .words {
      flex: 1 1 240px;
      margin: 0;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .words h2 { margin: 0 0 12px; font-size: 1.1rem; }
    .words .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: -8px 0 12px;
      color: var(--muted);
      font-size: 0.875rem;
    }
    .words .timer { font-weight: 600; font-variant-numeric: tabular-nums; }

    .celebrate {
      margin: 0 0 16px;
      padding: 12px;
      color: var(--found-text);
      background: var(--found-bg);
      border-radius: 6px;
      font-weight: 600;
      text-align: center;
      animation: pop 0.5s ease-out;
    }
    .celebrate[hidden] { display: none; }
    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      70% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .celebrate { animation: none; }
    }

    .confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .words ul { margin: 0; padding: 0; list-style: none; }
    .words li { padding: 6px 0; border-top: 1px solid var(--border); }
    .words li:first-child { border-top: 0; }
    .words ul.show-words li { font-weight: 600; letter-spacing: 0.05em; }
    .words ul.show-descriptions li { font-size: 0.95rem; }
    .words li.found { text-decoration: line-through; color: var(--muted); }

    .stats {
      margin-top: 24px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .stats h2 { margin: 0 0 12px; font-size: 1.1rem; }
    .stats dl {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin: 0;
    }
    .stats dl div { padding: 10px 12px; background: var(--bg); border-radius: 6px; }
    .stats dt { color: var(--muted); font-size: 0.8rem; }
    .stats dd { margin: 2px 0 0; font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .stats .note { margin: 10px 0 0; color: var(--muted); font-size: 0.8rem; }
    .stats .total { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 12px 0 0; }
    .stats .total button { padding: 4px 10px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Word Search Creator</h1>
    <p class="intro">Pick a category and difficulty, and Claude will choose the words for your puzzle.</p>

    <form id="puzzle-form">
      <div class="field grow">
        <label for="category">Category</label>
        <input id="category" name="category" type="text" required maxlength="50"
               placeholder="e.g. Space, Cars, Fruit" autocomplete="off">
      </div>

      <div class="field">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty" name="difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <div class="field">
        <label for="show">Show</label>
        <select id="show" name="show">
          <option value="words">Words</option>
          <option value="descriptions">Descriptions</option>
        </select>
      </div>

      <label class="toggle">
        <input id="dynamic" name="dynamic" type="checkbox">
        Dynamic mode
      </label>

      <button id="submit" type="submit">Create puzzle</button>
    </form>

    <p class="travel"><strong>How words travel:</strong> <span id="travel-note" aria-live="polite"></span></p>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="puzzle" class="puzzle" hidden>
      <div id="grid" class="grid" role="grid" aria-label="Word search grid"></div>
      <div class="words">
        <p id="celebrate" class="celebrate" role="status" hidden></p>
        <h2 id="list-heading">Words to find</h2>
        <div class="meta">
          <span id="progress" aria-live="polite"></span>
          <!-- Not aria-live: announcing every tick would drown out everything else. -->
          <span id="timer" class="timer" title="Time taken"></span>
        </div>
        <ul id="word-list"></ul>
      </div>
    </section>

    <!-- Separate from the puzzle so it can also be shown when generation fails (failed attempts are still billed). -->
    <!-- Always shown so the running total is visible from the start; the per-attempt figures
         (class "attempt") stay hidden until the first request to Claude. -->
    <section id="stats" class="stats">
      <h2 id="stats-heading">Generation cost</h2>
      <dl>
        <div class="attempt" hidden><dt>Time to generate</dt><dd id="stat-time"></dd></div>
        <div class="attempt" hidden><dt>Input tokens</dt><dd id="stat-input"></dd></div>
        <div class="attempt" hidden><dt>Output tokens</dt><dd id="stat-output"></dd></div>
        <div class="attempt" hidden><dt>Cost (US dollars)</dt><dd id="stat-cost"></dd></div>
        <div><dt>Running total (US dollars)</dt><dd id="stat-total"></dd></div>
      </dl>
      <p class="total note">
        <span id="stat-total-count"></span>
        <button id="reset-total" type="button">Reset total</button>
      </p>
      <p id="stat-note" class="note attempt" hidden></p>
    </section>
  </main>

  <script>
    const form = document.getElementById("puzzle-form");
    const submitButton = document.getElementById("submit");
    const statusEl = document.getElementById("status");
    const puzzleEl = document.getElementById("puzzle");
    const gridEl = document.getElementById("grid");
    const wordListEl = document.getElementById("word-list");
    const progressEl = document.getElementById("progress");
    const listHeadingEl = document.getElementById("list-heading");
    const showSelect = document.getElementById("show");
    const timerEl = document.getElementById("timer");
    const celebrateEl = document.getElementById("celebrate");

    // Puzzle state: cells[row][col] are the grid elements; each word has
    // {word, description, start: [row, col], end: [row, col], path, found, item}.
    let cells = [];
    let words = [];
    let dynamicPuzzle = false;   // whether the puzzle on screen was made in dynamic mode
    let drag = null;         // {start: [row, col], path: [[row, col], ...]} while the pointer is down
    let selection = [];      // dynamic mode: cells selected so far, kept between taps

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }

    // ----- How words travel -----
    // Must match ALLOWED_DIRECTIONS (directions.py) and PATH_RULES (paths.py).

    const TRAVEL_NOTES = {
      straight: {
        easy: "in straight lines, left to right or top to bottom.",
        medium: "in straight lines: left to right, top to bottom, or diagonally down or up to the right.",
        hard: "in straight lines in any of the eight directions, including backwards, upwards and diagonally.",
      },
      dynamic: {
        easy: "words bend once, moving only right or down. Each straight part is at least 3 letters long, " +
              "so words shorter than 5 letters stay straight. Drag through the letters in order, or tap them one at a time.",
        medium: "words bend once or twice, moving right, down, or diagonally down or up to the right. " +
                "Each straight part is at least 3 letters long, so words shorter than 5 letters stay straight. " +
                "Drag through the letters in order, or tap them one at a time.",
        hard: "words snake through the grid. Each letter can be in any of the eight squares touching the one " +
              "before, so a word can change direction at every letter, but it never uses the same square twice. " +
              "Drag through the letters in order, or tap them one at a time.",
      },
    };

    function updateTravelNote() {
      const mode = form.dynamic.checked ? "dynamic" : "straight";
      const text = TRAVEL_NOTES[mode][form.difficulty.value];
      document.getElementById("travel-note").textContent =
        mode === "dynamic" ? `Dynamic mode: ${text}` : `Words run ${text}`;
    }

    form.difficulty.addEventListener("change", updateTravelNote);
    form.dynamic.addEventListener("change", updateTravelNote);
    updateTravelNote();

    function drawGrid(grid) {
      gridEl.replaceChildren();
      gridEl.style.setProperty("--size", grid.length);
      cells = [];
      selection = [];

      grid.forEach((row, r) => {
        const rowEl = document.createElement("div");
        rowEl.setAttribute("role", "row");
        rowEl.style.display = "contents";
        cells.push([]);
        row.forEach((letter, c) => {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.setAttribute("role", "gridcell");
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.textContent = letter;
          rowEl.appendChild(cell);
          cells[r].push(cell);
        });
        gridEl.appendChild(rowEl);
      });
    }

    function drawWordList(list) {
      words = list.map((entry) => ({ ...entry, found: false, item: document.createElement("li") }));
      celebrateEl.hidden = true;
      renderWordList();
      startTimer();
      updateProgress();
    }

    // Each list item shows either the word or its description, never both,
    // depending on the "Show" option. Found items stay crossed out in either mode.
    function renderWordList() {
      const showWords = showSelect.value === "words";
      listHeadingEl.textContent = showWords ? "Words to find" : "Clues";
      wordListEl.className = showWords ? "show-words" : "show-descriptions";
      for (const entry of words) {
        entry.item.textContent = showWords ? entry.word : entry.description;
        entry.item.classList.toggle("found", entry.found);
      }
      wordListEl.replaceChildren(...words.map((entry) => entry.item));
    }

    showSelect.addEventListener("change", renderWordList);

    // Puzzles cost fractions of a cent, so show enough significant figures to be meaningful.
    function formatCost(usd) {
      if (usd === 0) return "$0.00";
      return usd >= 0.01 ? `$${usd.toFixed(2)}` : `$${usd.toPrecision(2)}`;
    }

    // Running total of generation cost, kept in this browser so it survives a refresh.
    // Storage can be unavailable (e.g. private browsing), so fall back to an in-memory total.
    const TOTAL_KEY = "wordsearch-cost-total";
    let costTotal = { usd: 0, puzzles: 0 };
    try {
      const saved = JSON.parse(localStorage.getItem(TOTAL_KEY));
      if (saved && Number.isFinite(saved.usd) && Number.isFinite(saved.puzzles)) costTotal = saved;
    } catch { /* keep the empty total */ }

    function saveTotal() {
      try { localStorage.setItem(TOTAL_KEY, JSON.stringify(costTotal)); } catch { /* not saved */ }
    }

    function drawTotal() {
      document.getElementById("stat-total").textContent = formatCost(costTotal.usd);
      const n = costTotal.puzzles;
      document.getElementById("stat-total-count").textContent =
        `Running total covers ${n} ${n === 1 ? "request" : "requests"} to Claude from this browser, including failed ones.`;
    }

    document.getElementById("reset-total").addEventListener("click", () => {
      costTotal = { usd: 0, puzzles: 0 };
      saveTotal();
      drawTotal();
    });

    drawTotal();   // show the saved total as soon as the page loads

    // failed: the stats are for an attempt that ended in an error (it is still billed).
    function drawStats(stats, failed = false) {
      document.getElementById("stats-heading").textContent =
        failed ? "Generation stats (failed attempt)" : "Generation stats";
      for (const el of document.querySelectorAll("#stats .attempt")) el.hidden = false;
      const count = new Intl.NumberFormat("en-GB");
      document.getElementById("stat-time").textContent = `${stats.seconds.toFixed(2)} s`;
      document.getElementById("stat-input").textContent = count.format(stats.input_tokens);
      document.getElementById("stat-output").textContent = count.format(stats.output_tokens);
      document.getElementById("stat-cost").textContent = formatCost(stats.cost_usd);
      document.getElementById("stat-note").textContent =
        `Model: ${stats.model}. Output tokens include Claude's thinking, which is billed as output.`;
    }

    // Every request that reached Claude is billed, including ones that ended in an error.
    function addToTotal(stats) {
      costTotal = { usd: costTotal.usd + stats.cost_usd, puzzles: costTotal.puzzles + 1 };
      saveTotal();
      drawTotal();
    }

    function updateProgress() {
      const found = words.filter((w) => w.found).length;
      progressEl.textContent = `${found} of ${words.length} found`;
      if (words.length && found === words.length) celebrate();
    }

    // ----- Timer and celebration -----

    let timer = null;        // {started, interval} while a puzzle is being solved

    function formatClock(ms) {
      const seconds = Math.floor(ms / 1000);
      return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    }

    // "1 minute 5 seconds", for the celebration message.
    function formatDuration(ms) {
      const seconds = Math.floor(ms / 1000);
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      const parts = [];
      if (m) parts.push(`${m} ${m === 1 ? "minute" : "minutes"}`);
      if (s || !m) parts.push(`${s} ${s === 1 ? "second" : "seconds"}`);
      return parts.join(" ");
    }

    function startTimer() {
      stopTimer();
      const started = performance.now();
      timerEl.textContent = formatClock(0);
      // Tick more often than once a second so the display never visibly skips a second.
      const interval = setInterval(() => { timerEl.textContent = formatClock(performance.now() - started); }, 250);
      timer = { started, interval };
    }

    // Stops the timer and returns the time taken in milliseconds.
    function stopTimer() {
      if (!timer) return 0;
      clearInterval(timer.interval);
      const elapsed = performance.now() - timer.started;
      timer = null;
      timerEl.textContent = formatClock(elapsed);
      return elapsed;
    }

    function celebrate() {
      const elapsed = stopTimer();
      celebrateEl.textContent = `🎉 Well done! You found all ${words.length} words in ${formatDuration(elapsed)}!`;
      celebrateEl.hidden = false;
      launchConfetti();
    }

    // A short burst of confetti on a full-screen canvas, removed when it finishes.
    function launchConfetti() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const canvas = document.createElement("canvas");
      canvas.className = "confetti";
      canvas.setAttribute("aria-hidden", "true");
      document.body.appendChild(canvas);
      const ctx = canvas.getContext("2d");
      const ratio = window.devicePixelRatio || 1;
      canvas.width = innerWidth * ratio;
      canvas.height = innerHeight * ratio;
      ctx.scale(ratio, ratio);

      const colours = ["#f3d27a", "#5fb39b", "#e86a5c", "#6a8fe8", "#c77de0", "#f29e4c"];
      const pieces = Array.from({ length: 160 }, () => ({
        x: innerWidth / 2 + (Math.random() - 0.5) * innerWidth * 0.4,
        y: innerHeight * 0.4,
        vx: (Math.random() - 0.5) * 14,          // pixels per frame at 60 fps
        vy: -4 - Math.random() * 12,
        size: 6 + Math.random() * 6,
        angle: Math.random() * Math.PI,
        spin: (Math.random() - 0.5) * 0.3,
        colour: colours[Math.floor(Math.random() * colours.length)],
      }));

      const DURATION = 3500;   // ms; the last 800 ms fade out
      const start = performance.now();
      let last = start;

      function frame(now) {
        const step = Math.min((now - last) / (1000 / 60), 3);   // keep the speed the same at any frame rate
        last = now;
        const age = now - start;
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        ctx.globalAlpha = Math.max(0, Math.min(1, (DURATION - age) / 800));
        for (const p of pieces) {
          p.vy += 0.3 * step;
          p.vx *= 0.99 ** step;
          p.x += p.vx * step;
          p.y += p.vy * step;
          p.angle += p.spin * step;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = p.colour;
          ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
          ctx.restore();
        }
        if (age < DURATION) requestAnimationFrame(frame);
        else canvas.remove();
      }
      requestAnimationFrame(frame);
    }

    // ----- Selection -----

    // nearCentre: only count the cell when the pointer is near its middle, so a drag that cuts
    // across the corner where four cells meet doesn't pick up a diagonal neighbour by mistake.
    function cellAt(x, y, nearCentre = false) {
      const el = document.elementFromPoint(x, y);
      const cell = el && el.closest(".cell");
      if (!cell || !gridEl.contains(cell)) return null;
      if (nearCentre) {
        const box = cell.getBoundingClientRect();
        const dx = x - (box.left + box.width / 2);
        const dy = y - (box.top + box.height / 2);
        const radius = 0.4 * Math.min(box.width, box.height);
        if (dx * dx + dy * dy > radius * radius) return null;
      }
      return [Number(cell.dataset.row), Number(cell.dataset.col)];
    }

    // Cells in a straight line from start towards target, snapped to the nearest
    // of the eight directions and clipped to the edge of the grid.
    function linePath(start, target) {
      const [r0, c0] = start;
      const dr = target[0] - r0;
      const dc = target[1] - c0;
      if (dr === 0 && dc === 0) return [start];

      const octant = Math.round(Math.atan2(dr, dc) / (Math.PI / 4));
      const stepR = Math.round(Math.sin(octant * Math.PI / 4));
      const stepC = Math.round(Math.cos(octant * Math.PI / 4));
      const size = cells.length;

      const path = [];
      for (let i = 0; i <= Math.max(Math.abs(dr), Math.abs(dc)); i++) {
        const r = r0 + stepR * i;
        const c = c0 + stepC * i;
        if (r < 0 || r >= size || c < 0 || c >= size) break;
        path.push([r, c]);
      }
      return path;
    }

    function sameCell(a, b) {
      return a[0] === b[0] && a[1] === b[1];
    }

    function samePath(a, b) {
      return a.length === b.length && a.every((cell, i) => sameCell(cell, b[i]));
    }

    function touching(a, b) {
      return Math.max(Math.abs(a[0] - b[0]), Math.abs(a[1] - b[1])) === 1;
    }

    // Dynamic mode drag: moving back onto a selected cell undoes the steps after it. If a fast
    // drag skips cells, the gap is filled one step at a time towards the pointer, stopping
    // before any cell that is already selected.
    function extendPath(path, target) {
      const existing = path.findIndex((cell) => sameCell(cell, target));
      if (existing !== -1) return path.slice(0, existing + 1);

      const next = [...path];
      let [r, c] = next[next.length - 1];
      while (r !== target[0] || c !== target[1]) {
        r += Math.sign(target[0] - r);
        c += Math.sign(target[1] - c);
        if (next.some((cell) => sameCell(cell, [r, c]))) break;
        next.push([r, c]);
      }
      return next;
    }

    // Dynamic mode tap: carry on from the current selection when the cell touches its end,
    // go back to the cell if it is already selected, otherwise start a new selection.
    function tapPath(path, cell) {
      const existing = path.findIndex((p) => sameCell(p, cell));
      if (existing !== -1) return path.slice(0, existing + 1);
      if (path.length && touching(path[path.length - 1], cell)) return [...path, cell];
      return [cell];
    }

    // In dynamic mode the last selected cell is outlined, to show where the next letter goes.
    function showSelection(path) {
      gridEl.querySelectorAll(".cell.selecting").forEach((el) => el.classList.remove("selecting", "end"));
      path.forEach(([r, c], i) => {
        cells[r][c].classList.add("selecting");
        if (dynamicPuzzle && i === path.length - 1) cells[r][c].classList.add("end");
      });
    }

    // Straight mode: the selection matches a word if its ends match the word's ends, in either order.
    // Dynamic mode: it must follow the word's own path, from either end. (Matching on letters alone
    // would accept a stray cell that happens to hold the same letter, and highlight the wrong cell.)
    function matchWord(path) {
      if (!path.length) return undefined;
      if (dynamicPuzzle) {
        const backwards = [...path].reverse();
        return words.find((w) => !w.found && (samePath(path, w.path) || samePath(backwards, w.path)));
      }
      const first = path[0];
      const last = path[path.length - 1];
      return words.find((w) => !w.found && (
        (sameCell(first, w.start) && sameCell(last, w.end)) ||
        (sameCell(first, w.end) && sameCell(last, w.start))
      ));
    }

    function markFound(entry) {
      entry.found = true;
      entry.item.classList.add("found");
      for (const [r, c] of entry.path) cells[r][c].classList.add("found");
      updateProgress();
    }

    gridEl.addEventListener("pointerdown", (event) => {
      const cell = cellAt(event.clientX, event.clientY);
      if (!cell || !words.length) return;
      event.preventDefault();
      gridEl.setPointerCapture(event.pointerId);
      if (dynamicPuzzle) {
        const last = selection[selection.length - 1];
        drag = {
          path: tapPath(selection, cell),
          moved: false,
          tappedEnd: last !== undefined && sameCell(last, cell),   // a tap here removes it
        };
      } else {
        drag = { start: cell, path: [cell] };
      }
      showSelection(drag.path);
    });

    gridEl.addEventListener("pointermove", (event) => {
      if (!drag) return;
      const target = cellAt(event.clientX, event.clientY, dynamicPuzzle);
      if (!target) return;
      if (dynamicPuzzle) {
        if (sameCell(target, drag.path[drag.path.length - 1])) return;
        drag.moved = true;
        drag.path = extendPath(drag.path, target);
      } else {
        drag.path = linePath(drag.start, target);
      }
      showSelection(drag.path);
    });

    // A word is marked as soon as the selection matches it. In dynamic mode an unmatched
    // selection stays, so the player can carry on tapping or dragging from it.
    gridEl.addEventListener("pointerup", () => {
      if (!drag) return;
      let path = drag.path;
      if (dynamicPuzzle && !drag.moved && drag.tappedEnd) path = path.slice(0, -1);
      const match = matchWord(path);
      if (match) markFound(match);
      selection = dynamicPuzzle && !match ? path : [];
      showSelection(selection);
      drag = null;
    });

    gridEl.addEventListener("pointercancel", () => {
      showSelection(selection);
      drag = null;
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && selection.length) {
        selection = [];
        showSelection(selection);
      }
    });

    // FastAPI sends errors as {detail: "..."} for HTTPException,
    // or {detail: [{msg: "..."}]} when the request fails validation.
    function errorMessage(body, status) {
      const detail = body && body.detail;
      if (typeof detail === "string") return detail;
      if (Array.isArray(detail) && detail.length) return detail[0].msg;
      return `Something went wrong (error ${status}). Please try again.`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const payload = {
        category: form.category.value.trim(),
        difficulty: form.difficulty.value,
        dynamic: form.dynamic.checked,
      };
      if (!payload.category) {
        setStatus("Please enter a category.", true);
        return;
      }

      submitButton.disabled = true;
      setStatus("Creating your puzzle…");

      try {
        const response = await fetch("/api/puzzle", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const body = await response.json().catch(() => null);

        if (!response.ok) {
          let message = errorMessage(body, response.status);
          if (body?.stats) {
            drawStats(body.stats, true);
            addToTotal(body.stats);
            message += ` (This attempt still cost ${formatCost(body.stats.cost_usd)}, added to the running total.)`;
          }
          setStatus(message, true);
          return;
        }

        dynamicPuzzle = payload.dynamic;
        drawGrid(body.grid);
        drawWordList(body.words);
        drawStats(body.stats);
        addToTotal(body.stats);
        puzzleEl.hidden = false;
        setStatus("");
      } catch {
        setStatus("Couldn't reach the server. Is it running?", true);
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
