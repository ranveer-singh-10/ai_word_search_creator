[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-word-search-creator"
version = "0.1.0"
description = "Word search generator using the Claude API for words and Python for grid placement."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "python-dotenv",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",      # needed by FastAPI's TestClient
    "jupyter",
    "pandas",
]

[project.scripts]
wordsearch = "wordsearch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
