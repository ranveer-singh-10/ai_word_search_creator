[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-word-search-creator"
version = "0.1.0"
description = "Word search generator using the Claude API for words and Python for grid placement."
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "pandas",
]

[tool.setuptools]
packages = ["wordsearch"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
